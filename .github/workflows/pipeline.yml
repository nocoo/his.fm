name: Pipeline

on:
  push:
    branches: [main]
  pull_request: {}
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after quality gate passes
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  quality:
    uses: ./.github/workflows/quality-slots.yml

  deploy:
    needs: [quality]
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.deploy == true)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@3703a073693d598159e87f77f99587e586c14cfe # v2026.24
    with:
      sparse-checkout: |
        /*
        !/artwork/design-20260926/
        !/artwork/hero-retina-20260926/
        !/artwork/originals/
        !/docs/design/assets/fonts/
      package-manager: npm
      runtime-version: "11.19.1"
      node-version: "26.12.1"
      install-policy: project
      artifact-name: web-build
      artifact-path: apps/web/.cloudflare/output/v0
      deploy-cli: cf
      cf-version: "1.0.0-beta.12"
      deploy-script: "node scripts/deploy.mjs"
      environment: production
      concurrency-group: deploy-worker-production
      timeout-minutes: 15
      verify-command: "node scripts/ci-verify-live.mjs"
      verify-retries: 6
      verify-retry-seconds: 10
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
