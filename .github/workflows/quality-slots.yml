name: Quality

on:
  workflow_call:
    outputs:
      tested-sha:
        value: ${{ jobs.z1-gate.outputs.tested-sha }}

permissions:
  contents: read
  actions: read

env:
  NPM_VERSION: "11.19.1"
  NODE_VERSION: "26.12.1"
  NPM_CONFIG_FETCH_RETRIES: "10"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "20000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  NPM_CONFIG_FETCH_TIMEOUT: "300000"
  NPM_CONFIG_INCLUDE: optional
  NPM_CONFIG_MAXSOCKETS: "8"

jobs:
  s1-types:
    name: "S1: Types"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: npm
          runtime-version: ${{ env.NPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - run: npm run typecheck

  s2-lint:
    name: "S2: Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: npm
          runtime-version: ${{ env.NPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - run: npm run lint

  s3-workflow:
    name: "S3: Workflow"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/lint-workflows@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17

  g1-secrets:
    name: "G1: Secrets"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: nocoo/base-ci/.github/actions/scan-secrets@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17

  g2-dependencies:
    name: "G2: Dependencies"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: nocoo/base-ci/.github/actions/scan-dependencies@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          lockfiles: "package-lock.json"

  b1-build:
    name: "B1: Build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: npm
          runtime-version: ${{ env.NPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - run: npm run ci:ensure-native-binaries && npm run build

  l1-unit:
    name: "L1: Unit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: nocoo/base-ci/.github/actions/setup-js@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
        with:
          package-manager: npm
          runtime-version: ${{ env.NPM_VERSION }}
          node-version: ${{ env.NODE_VERSION }}
          install-policy: project
      - run: npm run ci:ensure-native-binaries && npm run test:coverage

  l2-runtime:
    name: "L2: Runtime"
    if: ${{ vars.ENABLE_L2_RUNTIME == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - Miniflare/Worker bindings covered in L1 Vitest unit suite"

  l3-integration:
    name: "L3: Integration"
    if: ${{ vars.ENABLE_L3_INTEGRATION == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - no standalone HTTP API E2E suite"

  l4-e2e:
    name: "L4: E2E"
    if: ${{ vars.ENABLE_L4_E2E == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "TODO - Playwright suite not yet wired in CI"

  p1-package:
    name: "P1: Package"
    if: ${{ vars.ENABLE_P1_PACKAGE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "N/A - private monorepo, not published to npm"

  z1-gate:
    name: "Z1: Gate"
    runs-on: ubuntu-latest
    if: always()
    needs:
      - s1-types
      - s2-lint
      - s3-workflow
      - g1-secrets
      - g2-dependencies
      - b1-build
      - l1-unit
      - l2-runtime
      - l3-integration
      - l4-e2e
      - p1-package
    outputs:
      tested-sha: ${{ github.sha }}
    steps:
      - name: Verify all quality slots
        run: |
          echo "s1-types: ${{ needs.s1-types.result }}"
          echo "s2-lint: ${{ needs.s2-lint.result }}"
          echo "s3-workflow: ${{ needs.s3-workflow.result }}"
          echo "g1-secrets: ${{ needs.g1-secrets.result }}"
          echo "g2-dependencies: ${{ needs.g2-dependencies.result }}"
          echo "b1-build: ${{ needs.b1-build.result }}"
          echo "l1-unit: ${{ needs.l1-unit.result }}"
          echo "l2-runtime: ${{ needs.l2-runtime.result }}"
          echo "l3-integration: ${{ needs.l3-integration.result }}"
          echo "l4-e2e: ${{ needs.l4-e2e.result }}"
          echo "p1-package: ${{ needs.p1-package.result }}"
          for r in \
            "${{ needs.s1-types.result }}" \
            "${{ needs.s2-lint.result }}" \
            "${{ needs.s3-workflow.result }}" \
            "${{ needs.g1-secrets.result }}" \
            "${{ needs.g2-dependencies.result }}" \
            "${{ needs.b1-build.result }}" \
            "${{ needs.l1-unit.result }}"; do
            if [ "$r" != "success" ]; then
              echo "Required slot failed or was skipped: $r"
              exit 1
            fi
          done
          for r in \
            "${{ needs.l2-runtime.result }}" \
            "${{ needs.l3-integration.result }}" \
            "${{ needs.l4-e2e.result }}" \
            "${{ needs.p1-package.result }}"; do
            if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
              echo "Optional slot failed: $r"
              exit 1
            fi
          done
