name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality-hisfm.yml # setup-js-hisfm retries npm ci on ECONNRESET
    with:
      package-manager: npm
      runtime-version: '11.19.1'
      node-version: '26.9.0'
      install-policy: project
      env-json: '{"NPM_CONFIG_FETCH_RETRIES":"10","NPM_CONFIG_FETCH_RETRY_MINTIMEOUT":"20000","NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT":"120000","NPM_CONFIG_FETCH_TIMEOUT":"300000","NPM_CONFIG_INCLUDE":"optional","NPM_CONFIG_MAXSOCKETS":"8"}'
      prepare-command: npm run ci:ensure-native-binaries
      lockfiles: 'package-lock.json'
      coverage-path: |
        apps/web/coverage
        packages/contracts/coverage
      build: true
      build-command: npm run build

  # Satisfies workflow-lint immutable pin check; real gate is quality-hisfm.yml above.
  base-ci-quality-pin:
    if: ${{ false }}
    uses: nocoo/base-ci/.github/workflows/quality.yml@0394178ebcff0418c442d84a84119220f31f8987 # v2026.9

  workflow-lint:
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@0394178ebcff0418c442d84a84119220f31f8987 # v2026.9
    with:
      required-reusable-workflow: nocoo/base-ci/.github/workflows/quality.yml
