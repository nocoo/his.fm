name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    uses: nocoo/base-ci/.github/workflows/quality.yml@8816553dc9f4544d1e8486bacb5cce630a9f14cb # v2026.8
    with:
      package-manager: npm
      runtime-version: '11.19.1'
      node-version: '26.9.0'
      install-policy: project
      lockfiles: 'package-lock.json'
      coverage-path: coverage
      build: true
      build-command: npm run build

  workflow-lint:
    uses: nocoo/base-ci/.github/workflows/workflow-lint.yml@8816553dc9f4544d1e8486bacb5cce630a9f14cb # v2026.8
    with:
      required-reusable-workflow: nocoo/base-ci/.github/workflows/quality.yml
