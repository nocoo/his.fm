name: Release

on:
  release:
    types: [published]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to redeploy (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy Worker
    if: >-
      github.event_name == 'release' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    uses: nocoo/base-ci/.github/workflows/deploy-worker.yml@dc858360aa7812db61fd9d825943e4efd4dcd0e7 # v2026.17
    with:
      required-quality-check: "quality / Z1: Gate"
      expected-workflow-path: '.github/workflows/ci.yml'
      expected-workflow-name: 'CI'
      source-run-id: ${{ github.event_name == 'workflow_run' && format('{0}', github.event.workflow_run.id) || '' }}
      tag: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag || '' }}
      package-version-match: ${{ github.event_name != 'workflow_run' }}
      allowed-source-events: 'push,workflow_dispatch'
      require-fresh-main: false
      package-manager: npm
      runtime-version: '11.19.1'
      node-version: '26.12.1'
      install-policy: project
      build-command: npm run ci:build
      deploy-cli: cf
      deploy-script: node scripts/deploy.mjs
      environment: production
      concurrency-group: deploy-worker-production
      timeout-minutes: 15
      verify-command: node scripts/ci-verify-live.mjs
      verify-retries: 6
      verify-retry-seconds: 10
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
