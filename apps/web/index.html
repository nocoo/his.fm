    <title>his.fm · 世界很快，你可以慢慢来</title>
  </head>
  <body>
    <script>
      let storedTheme = null;
      try {
        storedTheme = localStorage.getItem('hisfm-theme');
      } catch {}
      const dark =
        storedTheme === 'dark' ||
        (storedTheme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
      const root = document.documentElement;
      root.classList.toggle('dark', dark);
      root.classList.toggle('light', !dark);
      root.dataset.mode = dark ? 'dark' : 'light';
      if (!root.dataset.publicTheme) {
        document.querySelector('meta[name="theme-color"]').content = getComputedStyle(root).backgroundColor;
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
